<!DOCTYPE html>
<html>
<head>
    <title>Test App</title>
    <style>
        .workshop-card { border: 1px solid #ccc; padding: 10px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Workshop Test</h1>
    <div id="workshop-list"></div>
    
    <script src="workshops.js"></script>
    <script>
        console.log('Workshops:', workshops);
        console.log('Count:', workshops.length);
        
        const workshopList = document.getElementById('workshop-list');
        workshops.forEach(workshop => {
            console.log('Adding workshop:', workshop.title);
            const card = document.createElement('div');
            card.className = 'workshop-card';
            card.innerHTML = `
                <h3>${workshop.title}</h3>
                <p>${workshop.description}</p>
                <div>${workshop.steps.length} steps</div>
            `;
            workshopList.appendChild(card);
        });
        
        console.log('Done adding workshops');
    </script>
</body>
</html>
