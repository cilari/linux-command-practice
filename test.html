<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<div id="output"></div>
<script src="workshops.js"></script>
<script>
console.log('Workshops loaded:', typeof workshops);
console.log('Workshop count:', workshops ? workshops.length : 'undefined');
if (workshops) {
    document.getElementById('output').innerHTML = `Found ${workshops.length} workshops`;
    workshops.forEach(w => {
        document.getElementById('output').innerHTML += `<br>${w.title}`;
    });
} else {
    document.getElementById('output').innerHTML = 'Workshops not loaded!';
}
</script>
</body>
</html>
